<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Career Timeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#08090D}
a{color:#F2F3F7;text-decoration:none}a:hover{color:#C8FF3D}
.navlink{color:#A1A5B5}.navlink:hover{color:#F2F3F7}
.glass{position:relative;isolation:isolate;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.03)),rgba(12,13,18,.42);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.05),0 24px 48px -24px rgba(0,0,0,.7)}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:radial-gradient(120% 70% at 15% 0%,rgba(255,255,255,.16),transparent 45%);pointer-events:none}
.entry{transition:border-color .3s,background .3s}
.entry:hover{border-color:rgba(200,255,61,.45);background:#13161D}
.char{display:inline-block;animation:charIn .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 100%}
@keyframes charIn{from{opacity:0;transform:perspective(600px) translateY(70%) rotateX(-95deg)}to{opacity:1;transform:none}}
.pagein{animation:pageIn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:perspective(1600px) translateZ(-220px) rotateX(5deg)}to{opacity:1;transform:none}}
@supports (animation-timeline: view()){
.progress{animation:progress linear both;animation-timeline:view();animation-range:entry 30% exit 70%}
@keyframes progress{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.reveal{animation:tunIn linear both,tunOut linear both;animation-timeline:view(),view();animation-range:entry 0% cover 40%,exit 30% exit 100%}
@keyframes tunIn{from{opacity:0;transform:perspective(1000px) translateZ(-700px) rotateX(24deg)}to{opacity:1;transform:none}}
@keyframes tunOut{to{opacity:0;transform:perspective(1000px) translateZ(260px) rotateX(-12deg)}}
.bigyear{animation:bigyear linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
@keyframes bigyear{from{transform:translateY(60px)}to{transform:translateY(-60px)}}
}
</style>
</helmet>
<div class="pagein" style="width: 100%; min-height: 100vh; background: #08090D; color: #F2F3F7; font-family: Inter, system-ui, sans-serif; overflow-x: clip">
  <header style="position: sticky; top: 16px; z-index: 50; display: flex; justify-content: center; padding: 16px 24px 0">
    <nav aria-label="Main" class="glass" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 28px; padding: 10px 10px 10px 20px; border-radius: 999px; max-width: 1100px; width: 100%; box-sizing: border-box">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px"><span style="display: inline-flex; width: 32px; height: 32px; border-radius: 10px; background: #C8FF3D; color: #08090D; align-items: center; justify-content: center; font-size: 14px">DR</span>daffa.dev</a>
      <div style="display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 14px; font-weight: 500">
        <a class="navlink" href="Skills.dc.html">Skills</a>
        <a class="navlink" href="Experience.dc.html">Experience</a>
        <a href="Career.dc.html" aria-current="page" style="color: #F2F3F7">Career</a>
        <a class="navlink" href="Contact.dc.html">Contact</a>
      </div>
      <a href="Contact.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; background: #F2F3F7; color: #08090D; font-weight: 600; font-size: 14px">Resume ↗</a>
    </nav>
  </header>

  <section style="position: relative; max-width: 1280px; margin: 0 auto; padding: 112px 32px 96px; box-sizing: border-box">
    <div aria-hidden="true" class="bigyear" style="position: absolute; right: 0; top: 40px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(120px, 22vw, 340px); letter-spacing: -0.06em; line-height: 1; color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.12)">2020→</div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #C8FF3D; margin-bottom: 20px; position: relative">CAREER TIMELINE</div>
    <h1 style="margin: 0; position: relative; font-family: 'Space Grotesk', sans-serif; font-size: clamp(56px, 9vw, 140px); line-height: 0.9; letter-spacing: -0.05em" aria-label="Six years, five teams.">
      <span aria-hidden="true" style="display: block"><sc-for list="{{h1a}}" as="ch" hint-placeholder-count="10"><span class="char" style="animation-delay: {{ch.d}}">{{ch.c}}</span></sc-for></span>
      <span aria-hidden="true" style="display: block"><sc-for list="{{h1b}}" as="ch" hint-placeholder-count="11"><span class="char" style="animation-delay: {{ch.d}}">{{ch.c}}</span></sc-for></span>
    </h1>
    <p style="margin: 40px 0 0; max-width: 520px; font-size: 18px; line-height: 1.6; color: #A1A5B5; position: relative">Professional journey from government systems in Bandung to platform engineering in Jakarta.</p>
  </section>

  <section style="max-width: 1100px; margin: 0 auto; padding: 0 32px 160px; box-sizing: border-box">
    <div style="position: relative; padding-left: 56px">
      <div aria-hidden="true" style="position: absolute; left: 15px; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.08)"></div>
      <div aria-hidden="true" class="progress" style="position: absolute; left: 15px; top: 0; bottom: 0; width: 2px; background: #C8FF3D; transform-origin: top"></div>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 32px">
        <sc-for list="{{jobs}}" as="j" hint-placeholder-count="5">
          <li class="reveal" style="position: relative">
            <span aria-hidden="true" style="position: absolute; left: -49px; top: 34px; width: 18px; height: 18px; border-radius: 99px; background: #08090D; border: 2px solid {{j.dot}}; box-shadow: 0 0 0 6px #08090D"></span>
            <article class="entry" style="border-radius: 28px; padding: 32px; background: #111319; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 18px">
              <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: baseline">
                <div>
                  <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; letter-spacing: -0.03em">{{j.company}}</h2>
                  <div style="margin-top: 6px; font-size: 15px; color: #A1A5B5">{{j.position}} · {{j.location}}</div>
                </div>
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.14); color: {{j.dot}}">{{j.period}}</span>
              </div>
              <ul style="margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 8px; color: #D5D7E0; font-size: 15px; line-height: 1.6">
                <sc-for list="{{j.points}}" as="pt" hint-placeholder-count="2"><li>{{pt}}</li></sc-for>
              </ul>
              <div style="display: flex; flex-wrap: wrap; gap: 6px">
                <sc-for list="{{j.skills}}" as="s" hint-placeholder-count="4"><span style="padding: 5px 10px; border-radius: 99px; background: #1B1E27; font-size: 12px; color: #D5D7E0">{{s}}</span></sc-for>
              </div>
            </article>
          </li>
        </sc-for>
      </ol>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3000}}'>
class Component extends DCLogic {
  renderVals() {
    const jobs = [
      { company: 'PT Sociolla Ritel Indonesia', position: 'Software Engineer', location: 'Jakarta', period: 'Nov 2023 — Present', dot: '#C8FF3D',
        points: ['Scalable backend services with Node.js, Express and MongoDB.', 'Elasticsearch for fast analytics over large operational data; RabbitMQ for async workflows.', 'Planned and shipped features with teams across Indonesia, India and Vietnam.'],
        skills: ['Node.js', 'Vue.js', 'MongoDB', 'ElasticSearch', 'AWS'] },
      { company: 'Binus University', position: 'Software Engineer', location: 'Jakarta', period: 'Apr — Nov 2023', dot: '#A1A5B5',
        points: ['Microservice backend in Node.js, Express and TypeScript for the Sokrates superapp.', 'Core APIs for threads, articles and videos behind an API Gateway with RBAC.'],
        skills: ['Node.js', 'express.js', 'TypeScript'] },
      { company: 'PT Kaldu Sari Nabati Indonesia', position: 'Software Engineer', location: 'Remote', period: 'Sep 2022 — Mar 2023', dot: '#A1A5B5',
        points: ['Built the eDOT Distribution System front end for B2B and B2C sales, inventory and shipping.'],
        skills: ['React', 'TypeScript', 'Redux'] },
      { company: 'PT Bank Rakyat Indonesia', position: 'Software Engineer', location: 'Remote', period: 'Nov 2020 — Aug 2022', dot: '#A1A5B5',
        points: ['Article website and forum for the pension division’s clients.'],
        skills: ['React', 'Node.js', 'MySQL'] },
      { company: 'Rupbasan Kelas I Bandung', position: 'Software Engineer', location: 'Bandung', period: 'Apr — Oct 2020', dot: '#A1A5B5',
        points: ['Guest registration system with special-guest configs, digital signatures and visitor diagrams.'],
        skills: ['React', 'Node.js'] }
    ];
    const split = (str, d0) => str.split('').map((c, i) => ({ c: c === ' ' ? ' ' : c, d: (d0 + i * 0.04).toFixed(3) + 's' }));
    return { jobs, h1a: split('Six years,', 0.1), h1b: split('five teams.', 0.5) };
  }
}
</script>
</body>
</html>
