<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile skills</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F2F3F7;text-decoration:none}a:hover{color:#C8FF3D}
.glass{position:relative;isolation:isolate;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.03)),rgba(12,13,18,.42);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.32)}
.char{display:inline-block;animation:charIn .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 100%}
@keyframes charIn{from{opacity:0;transform:perspective(600px) translateY(70%) rotateX(-95deg)}to{opacity:1;transform:none}}
</style>
</helmet>
<div onPointerMove="{{onPoint}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #08090D; color: #F2F3F7; font-family: Inter, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; width: 260px; height: 260px; left: -60px; top: 120px; border-radius: 50%; background: #8B7CFF; opacity: .4; filter: blur(60px)"></div>
  <div aria-hidden="true" style="position: absolute; width: 220px; height: 220px; right: -40px; top: 480px; border-radius: 50%; background: #C8FF3D; opacity: .25; filter: blur(60px)"></div>
  <header style="position: relative; display: flex; justify-content: space-between; align-items: center; padding: 20px 16px 0">
    <a href="Mobile.dc.html" aria-label="Back to home" class="glass" style="width: 44px; height: 44px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span class="glass" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #D5D7E0">↻ tilt your phone</span>
  </header>
  <section style="position: relative; padding: 28px 16px 0">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #C8FF3D; margin-bottom: 12px">SKILLS · 30 TOTAL</div>
    <h1 aria-label="Toolbox." style="margin: 0 0 24px; font-family: 'Space Grotesk', sans-serif; font-size: 64px; line-height: 0.9; letter-spacing: -0.05em"><span aria-hidden="true"><sc-for list="{{h1}}" as="ch" hint-placeholder-count="8"><span class="char" style="animation-delay: {{ch.d}}">{{ch.c}}</span></sc-for></span></h1>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; perspective: 900px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="8">
        <div style="position: relative; overflow: hidden; height: 128px; border-radius: 22px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; background: {{t.bg}}; color: {{t.fg}}; border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3); transform: {{t.tr}}; transition: transform .25s ease-out">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; opacity: .8">{{t.cat}}</span>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.03em">{{t.name}}</span>
          <span aria-hidden="true" style="position: absolute; inset: 0; background: {{glare}}; pointer-events: none"></span>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { b: 0, g: 0 };
    this.onOri = (e) => {
      this.setState({ b: Math.round(Math.max(-30, Math.min(30, (e.beta || 0) - 45))), g: Math.round(Math.max(-30, Math.min(30, e.gamma || 0))) });
    };
  }
  componentDidMount() { window.addEventListener('deviceorientation', this.onOri); }
  componentWillUnmount() { window.removeEventListener('deviceorientation', this.onOri); }
  renderVals() {
    const { b, g } = this.state;
    const raw = [['React', 'FRONTEND'], ['TypeScript', 'FRONTEND'], ['Node.js', 'BACKEND'], ['MongoDB', 'DATA'], ['Vue.js', 'FRONTEND'], ['Next.js', 'FRONTEND'], ['React Native', 'MOBILE'], ['Elasticsearch', 'DATA']];
    const tiles = raw.map((r, i) => {
      const depth = (i % 3) * 14;
      const k = 0.5 + (i % 2) * 0.3;
      const accent = i === 0 || i === 5;
      return {
        name: r[0], cat: r[1],
        bg: accent ? '#C8FF3D' : 'linear-gradient(140deg, rgba(255,255,255,0.16), rgba(255,255,255,0.03) 60%), rgba(17,19,25,0.6)',
        fg: accent ? '#08090D' : '#F2F3F7',
        tr: 'rotateX(' + Math.round(-b * k) + 'deg) rotateY(' + Math.round(g * k) + 'deg) translateZ(' + depth + 'px)'
      };
    });
    const split = (str) => str.split('').map((c, i) => ({ c, d: (0.1 + i * 0.04).toFixed(3) + 's' }));
    return {
      h1: split('Toolbox.'),
      tiles,
      glare: 'radial-gradient(circle at ' + (50 + g * 1.5) + '% ' + (50 + b * 1.5) + '%, rgba(255,255,255,0.22), transparent 50%)',
      onPoint: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        this.setState({ g: Math.round(((e.clientX - r.left) / r.width - 0.5) * 50), b: Math.round(((e.clientY - r.top) / r.height - 0.5) * 40) });
      }
    };
  }
}
</script>
</body>
</html>
